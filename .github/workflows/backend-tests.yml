name: Backend tests

# El deploy no pasa por acá: Render (backend) y Vercel (frontend) despliegan
# solos desde GitHub. Render espera a que este check pase.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

