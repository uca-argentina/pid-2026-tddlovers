# Blueprint de Render: backend y frontend. La base va en Neon; ver
# "Producción" en el README.
#
# Al aplicarlo, Render pide los valores marcados `sync: false` (DATABASE_URL).

services:
  - type: web
    name: pid-2026-tddlovers-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # Misma región que la base en Neon (aws-us-east-1): el backend hace varias
    # consultas por pedido y cada ida y vuelta entre regiones se suma.
    region: virginia
    plan: free
    healthCheckPath: /
    # Despliega solo si pasaron los checks de GitHub Actions (los tests).
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECRET
        generateValue: true
      # Cadena *pooled* de Neon (host con -pooler), con ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      # Bucket de Backblaze B2 para los archivos del material de las clases
      # (backend/src/storage/files.js). Los valores se cargan en el dashboard
      # de Render, nunca en el repo. Solo producción: en local es MinIO.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  - type: web
    name: pid-2026-tddlovers-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    routes:
      # El cliente le pega a /api con ruta relativa: reenviarlo desde acá deja
      # la app y la API en el mismo origen, así la cookie de sesión (sameSite
      # lax) viaja sin CORS. onrender.com es un sufijo público, así que
      # frontend y backend en subdominios propios serían sitios distintos.
      - type: rewrite
        source: /api/*
        destination: https://pid-2026-tddlovers-backend.onrender.com/api/*
      # Rutas de React Router: cualquier otra cosa que no sea un archivo.
      - type: rewrite
        source: /*
        destination: /index.html
