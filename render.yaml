# Blueprint de Render para el backend. El frontend va en Vercel
# (frontend/vercel.json) y la base en Neon; ver "Producción" en el README.
#
# Al aplicarlo, Render pide los valores marcados `sync: false` (DATABASE_URL).

services:
  - type: web
    name: pid-2026-tddlovers-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # Misma región que la base en Neon (aws-us-east-1): el backend hace varias
    # consultas por pedido y cada ida y vuelta entre regiones se suma.
    region: virginia
    plan: free
    healthCheckPath: /
    # Despliega solo si pasaron los checks de GitHub Actions (los tests).
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECRET
        generateValue: true
      # Cadena *pooled* de Neon (host con -pooler), con ?sslmode=require.
      - key: DATABASE_URL
        sync: false
